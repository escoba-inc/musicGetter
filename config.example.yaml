# MusicGetter Configuration Example

# List of YouTube or YouTube Music playlist URLs
playlists:
  - url: "https://music.youtube.com/playlist?list=PLrEnWoR732-B41U5c81p5G5vG17j61oTz"
    name: "Favorite Beats"
  - url: "https://www.youtube.com/playlist?list=PL4fGSIFgk5t2KqZpQo78jB3iS8s5sN1b8"
    name: "LoFi Chill"

# Target music directory (mounted into Navidrome as its music folder)
library_dir: "/music"

# State and database storage directory
data_dir: "/config"

# Audio download settings
audio:
  # Preferred format: "opus" (best quality on YouTube, native stream copy), "m4a", or "mp3"
  format: "opus"
  # Quality setting: "best" for native stream copy, or "320" for mp3 transcoding
  quality: "best"
  # Embed ReplayGain loudness normalization tags for consistent volume in Navidrome
  replaygain: true

# Library organization
organization:
  # Folder structure:
  # "standard": /music/{Artist}/{Album}/{TrackNumber} - {Title}.{ext}
  # "flat": /music/{Artist} - {Title}.{ext}
  structure: "standard"

  # Album Artist tag to use for compilation or varied-artist playlist tracks
  # Prevents 100 single-song artists from cluttering Navidrome's "Artists" view
  compilation_album_artist: "Various Artists"

  # Generate Navidrome-compatible .m3u8 playlist files in the playlists directory
  generate_m3u8: true
  playlists_dir: "/music/playlists"

  # Automatically delete tracks and sidecar .lrc files when removed from all playlists
  cleanup_removed_tracks: true

# Lyrics settings
lyrics:
  # Enable fetching and embedding lyrics
  enabled: true
  # Embed lyrics into audio file tags
  embed: true
  # Save a sidecar .lrc file alongside the audio file (recommended for Navidrome synced lyrics)
  save_lrc: true
  # Fetch synced/plain lyrics from LRCLIB (free, no API key needed)
  use_lrclib: true
  # Fallback to YouTube auto-captions / subtitles if LRCLIB doesn't have lyrics
  use_youtube_subtitles: true
  # Preferred subtitle languages (comma-separated or regex pattern)
  subtitle_languages: "en.*,es.*,all"

# Album artwork settings
artwork:
  # Embed cover art into audio tags
  embed: true
  # Save a copy as cover.jpg in the album folder for Navidrome
  save_cover_jpg: true
  # Maximum resolution to request from iTunes API (up to 3000)
  max_resolution: 3000
  # Automatically crop 16:9 YouTube thumbnails to 1:1 square if external cover art is not found
  crop_youtube_thumbnail: true

# Schedule settings
schedule:
  # Daily sync time (24-hour HH:MM format). Checks once every day at this time.
  daily_at: "03:00"
  # Run an immediate sync when the container / service starts up
  sync_on_startup: true

# Optional YouTube cookies file (place cookies.txt in /config if private playlists are needed)
cookies_file: "/config/cookies.txt"
