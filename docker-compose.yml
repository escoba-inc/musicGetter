services:
  # MusicGetter: Automated YouTube Music to Navidrome Downloader & Enricher
  musicgetter:
    build: .
    container_name: musicgetter
    restart: unless-stopped
    environment:
      - TZ=UTC

      # ==========================================
      # 🎵 PLAYLISTS (Add as many as you want!)
      # Format: URL or URL | Custom Name
      # ==========================================
      - PLAYLIST_1=https://music.youtube.com/playlist?list=PLrEnWoR732-B41U5c81p5G5vG17j61oTz | Favorite Beats
      - PLAYLIST_2=https://www.youtube.com/playlist?list=PL4fGSIFgk5t2KqZpQo78jB3iS8s5sN1b8 | Lo-Fi Chill

      # ==========================================
      # ⚙️ SETTINGS
      # ==========================================
      - AUDIO_FORMAT=opus         # "opus" (best YouTube quality), "m4a", or "mp3"
      - DAILY_AT=03:00            # Daily check time (24-hour HH:MM format)
      - SYNC_ON_STARTUP=true      # Sync immediately when container launches
      - LYRICS_ENABLED=true       # Fetch lyrics from LRCLIB & YouTube subtitles
      - SAVE_LRC=true             # Save synchronized .lrc sidecars for Navidrome
      - USE_YOUTUBE_SUBTITLES=true# Fallback to YouTube captions if LRCLIB has no lyrics
      - COVER_RESOLUTION=3000     # Pristine cover art resolution (up to 3000x3000px)
      - SAVE_COVER_JPG=true       # Save cover.jpg in album folder for Navidrome
      - COMPILATION_ALBUM_ARTIST=Various Artists # Prevents 100 1-song artists cluttering Navidrome
      - CLEANUP_REMOVED_TRACKS=true # Automatically deletes songs removed from all playlists
    volumes:
      - ./music:/music            # Target music folder shared with Navidrome
      - ./config:/config          # Stores SQLite database (library.db) & optional cookies.txt

  # Navidrome Music Server (Runs alongside MusicGetter)
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=""
    volumes:
      - ./navidrome-data:/data
      - ./music:/music:ro
    depends_on:
      - musicgetter
