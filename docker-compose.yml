services:
  # MusicGetter: Automated YouTube Music to Navidrome Downloader & Enricher
  musicgetter:
    build: .
    container_name: musicgetter
    restart: unless-stopped
    environment:
      - PUID=1000               # Change to your host user ID
      - PGID=1000               # Change to your host group ID
      - TZ=UTC
    volumes:
      - ./config:/config        # Location of config.yaml, cookies.txt, and library.db
      - ./music:/music          # Target music folder shared with Navidrome

  # Navidrome Music Server (Uncomment if you want to deploy Navidrome together)
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=""
    volumes:
      - ./navidrome-data:/data
      - ./music:/music:ro
    depends_on:
      - musicgetter
